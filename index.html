<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC KRESHA | Idea Box</title>
  <meta name="description" content="Drop your idea for the MC Kresha project. Open to everyone, no account needed.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
</head>
<body>

  <header class="hero">
    <p class="hero-kicker">MC KRESHA</p>
    <h1 class="hero-title">Idea Box</h1>
    <p class="hero-sub">
      Pitch a video concept, a feature, a sample, a city for the tour.
      Open to everyone, no account needed. The best ideas make it into the project.
    </p>
  </header>

  <main>
    <section class="section">
      <form id="idea-form" class="idea-form" hidden>
        <label class="field">
          <span>Your idea</span>
          <textarea id="idea-text" rows="4" maxlength="1000" required
            placeholder="Paint the scene... example: a video shot entirely on VHS, one location, one night."></textarea>
        </label>
        <div class="form-row">
          <label class="field">
            <span>Name or alias (optional)</span>
            <input id="idea-name" type="text" maxlength="60" placeholder="How should we credit you?">
          </label>
          <button type="submit" class="btn-send" id="idea-submit">Send it</button>
        </div>
        <input type="text" id="idea-website" name="website" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="form-msg" id="form-msg" role="status"></p>
      </form>

      <h2 class="wall-title">The Wall</h2>
      <div class="idea-grid" id="idea-grid">
        <p class="muted" id="idea-status">Loading ideas...</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>MC KRESHA</p>
    <p class="muted">Every idea lands with the team. Nothing gets lost.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
