name = "kresha-idea-box"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# 05:00 UTC is 07:00 in Gent in summer, 06:00 in winter. Cloudflare
# crons are always UTC, so this drifts by an hour and that is fine.
[triggers]
crons = ["0 5 * * *"]

# Finished work for clients. Private: nothing in here has a public
# address, the worker hands out links that expire instead.
[[r2_buckets]]
binding = "DELIVERIES"
bucket_name = "noir-deliveries"
