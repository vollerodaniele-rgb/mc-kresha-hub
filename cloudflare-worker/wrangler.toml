name = "kresha-idea-box"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# One schedule, every ten minutes. The deploy watch and the usage meter
# run each time. The daily jobs run in the first ten minutes of 05, 06
# and 07 UTC: the morning brief on whichever of 06 and 07 is 08:00 in
# Gent (crons are UTC, so this holds across the clock change), the health
# check on the other two. See scheduled() in worker.js.
[triggers]
crons = ["*/10 * * * *"]

# Finished work for clients, transfers, and the relay's small records.
# The bucket has no public address of its own (r2.dev is off): files
# reach people only through the worker, /file and /thumb for deliveries
# (open to anyone who knows the client, month and name) and transfer
# links, which expire.
[[r2_buckets]]
binding = "DELIVERIES"
bucket_name = "noir-deliveries"

# A budget per address, by the minute, so a flood cannot run the bill up
# on reads or fill the bucket with writes. Reads are generous: one
# portal page asks for a month of thumbnails at once, and an office
# behind a single address should never feel this. A write is always one
# person pressing one button, so it needs far less room.
[[ratelimits]]
name = "READ_RATE"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "WRITE_RATE"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60
