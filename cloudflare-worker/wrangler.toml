name = "kresha-idea-box"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# 05:00 UTC is the health check. It is 07:00 in Gent in summer and
# 06:00 in winter; drifting by an hour does not matter for a check
# that is silent unless something is wrong.
#
# 06:00 and 07:00 are the morning brief, which does matter: one of the
# two is 08:00 in Gent whatever the time of year, and the worker only
# speaks on that one. Cloudflare crons are always UTC, so this is how
# a fixed local hour is held across the changeover.
[triggers]
crons = ["0 5 * * *", "0 6 * * *", "0 7 * * *"]

# Finished work for clients. Private: nothing in here has a public
# address, the worker hands out links that expire instead.
[[r2_buckets]]
binding = "DELIVERIES"
bucket_name = "noir-deliveries"

# A budget per address, by the minute, so a flood cannot run the bill up
# on reads or fill the bucket with writes. Reads are generous: one
# portal page asks for a month of thumbnails at once, and an office
# behind a single address should never feel this. A write is always one
# person pressing one button, so it needs far less room.
[[ratelimits]]
name = "READ_RATE"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "WRITE_RATE"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60
